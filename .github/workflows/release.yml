name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag and runtime
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $version = (Get-Content -Raw manifest.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag and manifest version differ.' }
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:dictionaries
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build:sqlite
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- dictionary-catalog.js
          if ($LASTEXITCODE -ne 0) { throw 'Rebuilt dictionary catalog differs from the committed version.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build both installation packages
        run: ./package-release.ps1 -Ref HEAD

      - name: Publish the release and its assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          $version = (Get-Content -Raw manifest.json | ConvertFrom-Json).version
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) {
              Write-Output 'This release is already published. Its assets are left unchanged.'
              exit 0
            }
          } else {
            gh release create $tag --verify-tag --draft --title $tag --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag "dist/Clever-Youtube-Subtitle-Chrome-v$version.zip" "dist/Clever-Youtube-Subtitle-Kiwi-v$version.zip" dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
